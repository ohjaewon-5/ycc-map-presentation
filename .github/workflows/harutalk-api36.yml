name: HaruTalk Android 16 API 36 smoke test

on:
  push:
    branches: [ harutalk-build ]
    paths:
      - '.github/workflows/harutalk-api36.yml'
      - 'harutalk-src.tgz'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harutalk-api36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api36-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p harutalk
          tar -xzf harutalk-src.tgz --strip-components=1 -C harutalk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and verify APK
        working-directory: harutalk
        run: |
          gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee ../api36-apk-sha256.txt

      - name: Write Android 16 smoke script
        run: |
          cat > api36-smoke.sh <<'EOF'
          #!/usr/bin/env bash
          set -u
          mkdir -p api36-diagnostics
          APK="$(pwd)/harutalk/app/build/outputs/apk/debug/app-debug.apk"
          PKG="com.harutalk.app.debug"
          ACT="com.harutalk.app.MainActivity"

          adb devices -l > api36-diagnostics/device.txt 2>&1
          adb shell getprop ro.build.version.sdk > api36-diagnostics/api-level.txt 2>&1 || true
          adb shell getprop ro.build.version.release > api36-diagnostics/android-version.txt 2>&1 || true
          adb shell getprop sys.boot_completed > api36-diagnostics/boot-completed.txt 2>&1 || true
          sleep 15

          set +e
          timeout 300s adb install --no-streaming -r "$APK" > api36-diagnostics/install.txt 2>&1
          INSTALL_RC=$?
          set -e

          adb shell pm path "$PKG" > api36-diagnostics/package-path.txt 2>&1 || true
          adb shell pm grant "$PKG" android.permission.RECORD_AUDIO > api36-diagnostics/grant-mic.txt 2>&1 || true
          adb logcat -c || true
          adb shell am force-stop "$PKG" || true

          set +e
          timeout 60s adb shell am start -W -n "$PKG/$ACT" > api36-diagnostics/start.txt 2>&1
          START_RC=$?
          set -e
          sleep 15

          PID="$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r\n')"
          adb shell dumpsys activity activities > api36-diagnostics/activity.txt 2>&1 || true
          adb shell dumpsys window windows > api36-diagnostics/window.txt 2>&1 || true
          adb exec-out screencap -p > api36-diagnostics/screen.png 2>/dev/null || true
          timeout 30s adb logcat -d -v threadtime > api36-diagnostics/logcat.txt 2>&1 || true

          grep -F 'Process: com.harutalk.app.debug' api36-diagnostics/logcat.txt > api36-diagnostics/app-crash-marker.txt || true
          grep -E 'am_crash|am_anr|Unable to start activity|NoClassDefFoundError|VerifyError|UnsatisfiedLinkError' api36-diagnostics/logcat.txt | grep -F 'harutalk' > api36-diagnostics/app-suspect.txt || true

          RESUMED=0
          WINDOW=0
          if grep -F 'ResumedActivity:' api36-diagnostics/activity.txt | grep -F "$PKG/$ACT" >/dev/null 2>&1; then RESUMED=1; fi
          if grep -F "$PKG/$ACT" api36-diagnostics/window.txt >/dev/null 2>&1; then WINDOW=1; fi

          FAIL=0
          {
            echo "install_rc=$INSTALL_RC"
            echo "start_rc=$START_RC"
            echo "pid=$PID"
            echo "resumed_activity=$RESUMED"
            echo "app_window=$WINDOW"
            echo "screen_bytes=$(wc -c < api36-diagnostics/screen.png 2>/dev/null || echo 0)"
          } > api36-diagnostics/result.txt

          if [ "$INSTALL_RC" -ne 0 ]; then echo 'APK install failed' >> api36-diagnostics/result.txt; FAIL=1; fi
          if [ "$START_RC" -ne 0 ]; then echo 'Activity start failed' >> api36-diagnostics/result.txt; FAIL=1; fi
          if [ -z "$PID" ]; then echo 'Process missing after launch' >> api36-diagnostics/result.txt; FAIL=1; fi
          if [ "$RESUMED" -ne 1 ]; then echo 'MainActivity is not resumed' >> api36-diagnostics/result.txt; FAIL=1; fi
          if [ "$WINDOW" -ne 1 ]; then echo 'MainActivity window not found' >> api36-diagnostics/result.txt; FAIL=1; fi
          if [ -s api36-diagnostics/app-crash-marker.txt ]; then echo 'HaruTalk AndroidRuntime crash marker detected' >> api36-diagnostics/result.txt; FAIL=1; fi
          if [ -s api36-diagnostics/app-suspect.txt ]; then echo 'HaruTalk runtime suspect entry detected' >> api36-diagnostics/result.txt; FAIL=1; fi
          echo "fail=$FAIL" >> api36-diagnostics/result.txt

          echo '=== RESULT ==='
          cat api36-diagnostics/result.txt
          echo '=== INSTALL ==='
          cat api36-diagnostics/install.txt || true
          echo '=== START ==='
          cat api36-diagnostics/start.txt || true
          echo '=== HARUTALK CRASH MARKER ==='
          cat api36-diagnostics/app-crash-marker.txt || true
          exit "$FAIL"
          EOF
          chmod +x api36-smoke.sh

      - name: Boot Android 16 ATD emulator and launch HaruTalk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ./api36-smoke.sh

      - name: Upload Android 16 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-api36-atd-diagnostics
          path: |
            api36-diagnostics
            api36-apk-sha256.txt
          if-no-files-found: error

      - name: Upload Android 16 tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-api36-tested-apk
          path: harutalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
