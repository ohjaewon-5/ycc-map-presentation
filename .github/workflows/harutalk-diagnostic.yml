name: HaruTalk diagnostic launch test

on:
  push:
    branches: [ harutalk-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p harutalk
          tar -xzf harutalk-src.tgz --strip-components=1 -C harutalk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean build
        working-directory: harutalk
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify generated APK
        run: |
          APK=harutalk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"

      - name: Write single-process emulator smoke script
        run: |
          cat > ci-smoke.sh <<'EOF'
          #!/usr/bin/env bash
          set -u
          mkdir -p ci-diagnostics

          APK="$(pwd)/harutalk/app/build/outputs/apk/debug/app-debug.apk"
          PKG="com.harutalk.app.debug"
          ACT="com.harutalk.app.MainActivity"

          echo '=== adb devices ===' | tee ci-diagnostics/device.txt
          adb devices -l | tee -a ci-diagnostics/device.txt
          adb shell getprop ro.build.version.sdk > ci-diagnostics/api-level.txt 2>&1 || true
          adb shell getprop sys.boot_completed > ci-diagnostics/boot-completed.txt 2>&1 || true

          # The software-emulated API 35 runner is very slow immediately after boot.
          # Give PackageManager time to settle and use non-streaming install so a timeout
          # cannot leave a partially transferred base.apk.
          sleep 30
          adb shell pm trim-caches 256M >/dev/null 2>&1 || true

          set +e
          timeout 300s adb install --no-streaming -r "$APK" > ci-diagnostics/install.txt 2>&1
          INSTALL_RC=$?
          set -e

          adb shell pm path "$PKG" > ci-diagnostics/package-path.txt 2>&1 || true
          adb shell dumpsys package "$PKG" > ci-diagnostics/package.txt 2>&1 || true
          adb logcat -c || true
          adb shell am force-stop "$PKG" || true

          set +e
          timeout 60s adb shell am start -W -n "$PKG/$ACT" > ci-diagnostics/start.txt 2>&1
          START_RC=$?
          set -e

          sleep 12
          PID="$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r\n')"

          adb shell dumpsys activity activities > ci-diagnostics/activity.txt 2>&1 || true
          adb shell dumpsys window windows > ci-diagnostics/window.txt 2>&1 || true
          timeout 30s adb logcat -d -v threadtime > ci-diagnostics/logcat.txt 2>&1 || true

          grep -E 'FATAL EXCEPTION|Process: com\.harutalk\.app\.debug|AndroidRuntime.*com\.harutalk\.app\.debug' ci-diagnostics/logcat.txt > ci-diagnostics/fatal.txt || true
          grep -E 'am_crash|am_anr|Force finishing activity|Unable to start activity|RuntimeException|NoClassDefFoundError|VerifyError|UnsatisfiedLinkError' ci-diagnostics/logcat.txt > ci-diagnostics/suspect.txt || true

          FAIL=0
          {
            echo "install_rc=$INSTALL_RC"
            echo "start_rc=$START_RC"
            echo "pid=$PID"
          } > ci-diagnostics/result.txt

          if [ "$INSTALL_RC" -ne 0 ]; then echo 'APK install failed' >> ci-diagnostics/result.txt; FAIL=1; fi
          if [ "$START_RC" -ne 0 ]; then echo 'Activity start command failed' >> ci-diagnostics/result.txt; FAIL=1; fi
          if [ -z "$PID" ]; then echo 'App process is not alive 12 seconds after launch' >> ci-diagnostics/result.txt; FAIL=1; fi
          if [ -s ci-diagnostics/fatal.txt ]; then echo 'Fatal AndroidRuntime entry detected' >> ci-diagnostics/result.txt; FAIL=1; fi
          echo "fail=$FAIL" >> ci-diagnostics/result.txt

          echo '=== RESULT ==='
          cat ci-diagnostics/result.txt
          echo '=== INSTALL ==='
          cat ci-diagnostics/install.txt || true
          echo '=== START ==='
          cat ci-diagnostics/start.txt || true
          echo '=== FATAL ==='
          cat ci-diagnostics/fatal.txt || true
          echo '=== SUSPECT ==='
          cat ci-diagnostics/suspect.txt || true

          exit "$FAIL"
          EOF
          chmod +x ci-smoke.sh

      - name: API 35 install and launch diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ./ci-smoke.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-emulator-diagnostics-v4
          path: |
            ci-diagnostics
            apk-sha256.txt
          if-no-files-found: error

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-tested-apk-v4
          path: harutalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
