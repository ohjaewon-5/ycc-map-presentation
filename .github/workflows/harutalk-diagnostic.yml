name: HaruTalk diagnostic launch test

on:
  push:
    branches: [ harutalk-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p harutalk
          tar -xzf harutalk-src.tgz --strip-components=1 -C harutalk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean build
        working-directory: harutalk
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify generated APK
        run: |
          APK=harutalk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"

      - name: API 35 install and launch diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            mkdir -p ci-diagnostics
            APK=harutalk/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.harutalk.app.debug
            ACT=com.harutalk.app.MainActivity

            echo '=== adb devices ===' | tee ci-diagnostics/device.txt
            adb devices -l | tee -a ci-diagnostics/device.txt
            adb shell getprop ro.build.version.sdk > ci-diagnostics/api-level.txt 2>&1 || true

            timeout 30s adb install -r "$APK" > ci-diagnostics/install.txt 2>&1
            INSTALL_RC=$?

            adb shell pm path "$PKG" > ci-diagnostics/package-path.txt 2>&1 || true
            adb shell dumpsys package "$PKG" > ci-diagnostics/package.txt 2>&1 || true
            adb logcat -c || true
            adb shell am force-stop "$PKG" || true

            timeout 30s adb shell am start -W -n "$PKG/$ACT" > ci-diagnostics/start.txt 2>&1
            START_RC=$?
            sleep 10

            PID="$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r\n')"
            adb shell dumpsys activity activities > ci-diagnostics/activity.txt 2>&1 || true
            adb shell dumpsys window windows > ci-diagnostics/window.txt 2>&1 || true
            timeout 15s adb logcat -d -v threadtime > ci-diagnostics/logcat.txt 2>&1 || true

            grep -E 'FATAL EXCEPTION|Process: com\.harutalk\.app\.debug|AndroidRuntime.*com\.harutalk\.app\.debug' ci-diagnostics/logcat.txt > ci-diagnostics/fatal.txt || true
            grep -E 'am_crash|am_anr|Force finishing activity|Unable to start activity|RuntimeException|NoClassDefFoundError|VerifyError|UnsatisfiedLinkError' ci-diagnostics/logcat.txt > ci-diagnostics/suspect.txt || true

            FAIL=0
            {
              echo "install_rc=$INSTALL_RC"
              echo "start_rc=$START_RC"
              echo "pid=$PID"
            } > ci-diagnostics/result.txt

            if [ "$INSTALL_RC" -ne 0 ]; then echo 'APK install failed' | tee -a ci-diagnostics/result.txt; FAIL=1; fi
            if [ "$START_RC" -ne 0 ]; then echo 'Activity start command failed' | tee -a ci-diagnostics/result.txt; FAIL=1; fi
            if [ -z "$PID" ]; then echo 'App process is not alive 10 seconds after launch' | tee -a ci-diagnostics/result.txt; FAIL=1; fi
            if [ -s ci-diagnostics/fatal.txt ]; then echo 'Fatal AndroidRuntime entry detected' | tee -a ci-diagnostics/result.txt; FAIL=1; fi

            echo "fail=$FAIL" >> ci-diagnostics/result.txt
            echo '=== RESULT ==='
            cat ci-diagnostics/result.txt
            echo '=== START ==='
            cat ci-diagnostics/start.txt || true
            echo '=== FATAL ==='
            cat ci-diagnostics/fatal.txt || true
            echo '=== SUSPECT ==='
            cat ci-diagnostics/suspect.txt || true

            if [ "$FAIL" -ne 0 ]; then exit 1; fi
            echo 'HaruTalk API 35 launch smoke test PASSED.'

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-emulator-diagnostics-v2
          path: |
            ci-diagnostics
            apk-sha256.txt
          if-no-files-found: error

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-tested-apk-v2
          path: harutalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
