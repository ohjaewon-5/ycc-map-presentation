name: HaruTalk Android build and boot test

on:
  workflow_dispatch:
  push:
    branches: [ harutalk-build ]
    paths:
      - 'harutalk-src.tgz'
      - '.github/workflows/harutalk-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract HaruTalk source
        run: |
          mkdir -p harutalk
          tar -xzf harutalk-src.tgz --strip-components=1 -C harutalk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit test, lint, compile and build
        working-directory: harutalk
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK
        working-directory: harutalk
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-debug-apk
          path: harutalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract HaruTalk source
        run: |
          mkdir -p harutalk
          tar -xzf harutalk-src.tgz --strip-components=1 -C harutalk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: harutalk
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Boot API 35 emulator, install, launch and capture diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            mkdir -p ci-diagnostics
            APK=harutalk/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.harutalk.app.debug
            ACT=com.harutalk.app.MainActivity

            adb install -r "$APK" 2>&1 | tee ci-diagnostics/install.txt
            INSTALL_RC=${PIPESTATUS[0]}
            adb logcat -c || true
            adb shell am force-stop "$PKG" || true

            adb shell am start -W -n "$PKG/$ACT" 2>&1 | tee ci-diagnostics/start.txt
            START_RC=${PIPESTATUS[0]}
            sleep 8

            PID="$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r')"
            printf 'install_rc=%s\nstart_rc=%s\npid=%s\n' "$INSTALL_RC" "$START_RC" "$PID" | tee ci-diagnostics/result.txt

            adb shell dumpsys activity activities > ci-diagnostics/activity.txt 2>&1 || true
            adb shell uiautomator dump /sdcard/harutalk-ui.xml > ci-diagnostics/uiautomator-command.txt 2>&1 || true
            adb pull /sdcard/harutalk-ui.xml ci-diagnostics/ui.xml > ci-diagnostics/uiautomator-pull.txt 2>&1 || true
            adb logcat -d -v threadtime > ci-diagnostics/logcat.txt 2>&1 || true
            grep -E 'FATAL EXCEPTION|Process: com\.harutalk\.app\.debug|AndroidRuntime.*com\.harutalk\.app\.debug' ci-diagnostics/logcat.txt > ci-diagnostics/fatal.txt || true

            FAIL=0
            if [ "$INSTALL_RC" -ne 0 ]; then echo 'APK install failed' | tee -a ci-diagnostics/result.txt; FAIL=1; fi
            if [ "$START_RC" -ne 0 ]; then echo 'Activity start command failed' | tee -a ci-diagnostics/result.txt; FAIL=1; fi
            if [ -z "$PID" ]; then echo 'App process is not alive after launch' | tee -a ci-diagnostics/result.txt; FAIL=1; fi
            if [ -s ci-diagnostics/fatal.txt ]; then echo 'Fatal AndroidRuntime entry detected' | tee -a ci-diagnostics/result.txt; FAIL=1; fi

            if [ "$FAIL" -ne 0 ]; then
              echo '--- start output ---'
              cat ci-diagnostics/start.txt || true
              echo '--- fatal log ---'
              cat ci-diagnostics/fatal.txt || true
              exit 1
            fi

            echo 'HaruTalk launch smoke test passed.' | tee -a ci-diagnostics/result.txt
            exit 0
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HaruTalk-emulator-diagnostics
          path: ci-diagnostics
          if-no-files-found: error
